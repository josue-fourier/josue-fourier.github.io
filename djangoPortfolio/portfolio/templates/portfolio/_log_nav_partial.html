{% load hud_tags %}
{% for log in page_obj %}
<button class="log-item p-4 lg:p-5 text-left w-[72vw] sm:w-[260px] md:w-full flex-none snap-center md:snap-align-none flex flex-col justify-between gap-2 {% if forloop.first and not page_obj.has_previous %}active{% endif %} cursor-pointer"
        hx-get="{% url 'single_log' log.id %}"
        hx-target="#log-content-area"
        hx-swap="innerHTML transition:true"
        hx-indicator="#log-skeleton">

    <div class="flex flex-wrap justify-between items-center w-full gap-1 font-mono text-[10px] uppercase tracking-wider">
        <span class="text-emerald-400 font-bold whitespace-nowrap">{{ log.date|short_timesince }}</span>
        <span class="text-zinc-500 truncate max-w-[130px]">{{ log.project.name|default:"System" }}</span>
    </div>

    <h3 class="font-display font-bold text-sm text-white line-clamp-2 log-title leading-snug">{{ log.title }}</h3>

    <div class="flex justify-between items-center w-full font-mono text-[10px]">
        <div class="flex gap-1.5 overflow-hidden">
            {% for tech in log.stack.all|slice:":2" %}
                <span class="px-1.5 py-0.5 border border-white/10 text-zinc-400 uppercase whitespace-nowrap">#{{ tech.technology }}</span>
            {% endfor %}
        </div>
        <span class="text-zinc-600 ml-auto whitespace-nowrap tabular-nums">{{ log.date|date:"Y-m-d" }}</span>
    </div>
</button>
{% endfor %}

<!-- Manual Load More Button -->
{% if page_obj.has_next %}
<button class="log-item btn-sweep btn-sweep-emerald p-4 text-center w-[55vw] sm:w-[200px] md:w-full flex-none snap-center md:snap-align-none flex items-center justify-center min-h-[76px] md:min-h-[84px] cursor-pointer text-emerald-400"
        hx-get="{% url 'log_list' %}?page={{ page_obj.next_page_number }}"
        hx-target="this"
        hx-swap="outerHTML">
    <span class="font-mono text-xs uppercase tracking-widest font-bold flex items-center gap-2">
        <span>Load more</span>
        <span>↓</span>
    </span>
</button>
{% endif %}
