{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="lofi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging // Telematics HUD</title>
    <!-- Static CSS -->
    <link rel="stylesheet" href="{% static 'portfolio/main.css' %}">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Mermaid.js -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        :root {
            --brand-primary: #0d9488;
        }
        body {
            color: #1e293b;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        
        /* Light Weave - Aura */
        .aura-bg {
            position: relative;
            overflow: hidden;
            min-height: 100vh;
            background-color: #faf8f2;
        }
        .aura-layer-1 {
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(14,165,233,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(14,165,233,0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            mix-blend-mode: normal;
            transform: translateZ(0);
            will-change: transform;
            pointer-events: none;
        }
        .aura-layer-2 {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 51% 39%, rgba(56,189,248,0.25) 0%, transparent 50%);
            mix-blend-mode: normal;
            filter: blur(150px);
            transform: translateZ(0);
            will-change: transform;
            pointer-events: none;
        }
        @media (min-width: 768px) { .aura-layer-2 { filter: blur(216px); } }
        .aura-layer-3 {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 70%, rgba(99,102,241,0.15) 0%, transparent 40%);
            mix-blend-mode: normal;
            filter: blur(125px);
            transform: translateZ(0);
            will-change: transform;
            pointer-events: none;
        }
        @media (min-width: 768px) { .aura-layer-3 { filter: blur(180px); } }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Premium Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .hud-border {
            border: 1px solid rgba(0, 0, 0, 0.05);
            position: relative;
        }
        .hud-border::before, .hud-border::after {
            content: '';
            position: absolute;
            width: 8px; height: 8px;
            border-color: var(--brand-primary);
            border-style: solid;
            transition: all 0.3s ease;
        }
        .hud-border::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
        .hud-border::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
        .hud-border:hover::before, .hud-border:hover::after {
            width: 12px; height: 12px;
            border-width: 2px;
        }

        /* Radial Wheel (Desktop) */
        @media (min-width: 1024px) {
            #log-nav {
                position: relative;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: flex-start;
                padding-left: 2rem;
            }
            .log-item {
                position: absolute;
                transform-origin: left center;
                transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
                width: 280px;
                opacity: 0;
                pointer-events: none;
            }
            .log-item.active {
                opacity: 1;
                pointer-events: auto;
                transform: translate(40px, 0) scale(1.1);
                z-index: 10;
                border-color: rgba(13, 148, 136, 0.6);
                background: rgba(13, 148, 136, 0.05);
                box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
            }
            .log-item.visible {
                opacity: 0.5;
                pointer-events: auto;
            }
            .log-item.visible:hover {
                opacity: 0.8;
                border-color: rgba(45, 212, 191, 0.3);
            }
        }

        /* Horizontal Scroll (Mobile) */
        @media (max-width: 1023px) {
            #log-nav {
                display: flex;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                gap: 1rem;
                padding: 1rem;
                scrollbar-width: none;
            }
            #log-nav::-webkit-scrollbar { display: none; }
            .log-item {
                flex: 0 0 85%;
                scroll-snap-align: center;
                transition: all 0.3s ease;
            }
            .log-item.active {
                border-color: rgba(13, 148, 136, 0.6);
                background: rgba(13, 148, 136, 0.05);
            }
        }
        
        /* Markdown Styles */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            color: #0f172a;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            font-weight: 700;
        }
        .markdown-body p { margin-bottom: 1rem; line-height: 1.6; color: #475569; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #475569; }
        .markdown-body code {
            background: rgba(0,0,0,0.05);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            color: var(--brand-primary);
        }
        .markdown-body pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }
        .markdown-body pre {
            background: #f1f5f9;
            border: 1px solid rgba(0,0,0,0.05);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 1rem;
            color: #334155;
        }
        .markdown-body blockquote {
            border-left: 4px solid var(--brand-primary);
            padding-left: 1rem;
            margin-bottom: 1rem;
            color: #64748b;
            font-style: italic;
            background: rgba(13, 148, 136, 0.05);
            padding: 1rem;
            border-radius: 0 8px 8px 0;
        }
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
            font-size: 0.9em;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid rgba(0,0,0,0.05);
            padding: 0.75rem;
            text-align: left;
        }
        .markdown-body th {
            background-color: rgba(0,0,0,0.02);
            font-weight: 700;
            color: #0f172a;
        }
        .markdown-body img {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="min-h-screen selection:bg-brand-primary selection:text-white text-slate-800">
    <div class="aura-bg">
        <div class="aura-layer-1" aria-hidden="true"></div>
        <div class="aura-layer-2" aria-hidden="true"></div>
        <div class="aura-layer-3" aria-hidden="true"></div>
        <div style="position: relative; z-index: 1;" class="h-[100dvh] flex flex-col overflow-hidden">
            <!-- Top Nav HUD -->
            <nav class="w-full border-b border-black/5 bg-white/40 backdrop-blur-md sticky top-0 z-50">
                <div class="max-w-[1800px] mx-auto px-6 py-4 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-2 rounded-full bg-brand-primary animate-pulse"></div>
                        <h1 class="font-mono text-sm tracking-widest text-brand-primary uppercase font-bold">Sys_Log // Telematics</h1>
                    </div>
                    <a href="/" class="text-xs font-mono text-slate-500 hover:text-brand-primary transition-colors font-medium">[ RETURN_HOME ]</a>
                </div>
            </nav>

            <!-- Split Screen Layout -->
            <main class="flex-grow flex flex-col lg:flex-row w-full max-w-[1800px] mx-auto overflow-hidden">
                <!-- Left Nav: Radial Wheel (Desktop) / Horizontal Scroll (Mobile) -->
                <aside class="w-full lg:w-[35%] h-auto lg:h-full lg:border-r border-black/5 relative overflow-hidden flex flex-col flex-shrink-0">
                    <div class="p-6 border-b border-black/5 lg:border-none">
                        <p class="text-xs font-mono text-slate-500 mb-1 font-medium">TOTAL_RECORDS // {{ log_count|default:0 }}</p>
                        <h2 class="text-2xl font-bold text-slate-900">Engineering Logs</h2>
                    </div>
            
            <div id="log-nav" class="flex-grow w-full relative">
                {% include 'portfolio/_log_nav_partial.html' %}
            </div>
        </aside>

        <!-- Right Content: Rendering Area -->
        <section id="log-scroll-container" class="w-full lg:w-[65%] p-6 lg:p-12 flex-grow overflow-y-auto">
            <div id="log-content-area" class="glass-panel hud-border p-8 lg:p-12 rounded-xl min-h-full">
                <!-- HTMX Target Area. Initial load placeholder -->
                <div class="flex items-center justify-center h-full text-slate-500 font-mono text-sm">
                    AWAITING_SELECTION...
                </div>
            </div>
        </section>
    </main>

    <script>
        // --- 1. INITIALIZE MERMAID ---
        mermaid.initialize({ 
            startOnLoad: false, 
            theme: 'default',
            fontFamily: 'JetBrains Mono'
        });

        // Config marked for markdown parsing (if you render markdown on frontend)
        const renderer = new marked.Renderer();
        const originalCodeRenderer = renderer.code.bind(renderer);
        renderer.code = function(code, language, isEscaped) {
            if (language === 'mermaid') {
                return `<div class="mermaid">${code}</div>`;
            }
            return originalCodeRenderer(code, language, isEscaped);
        };
        marked.setOptions({ renderer });

        // --- 2. RADIAL WHEEL MATH (DESKTOP) ---
        let activeIndex = 0;

        function updateNavPositions() {
            const items = document.querySelectorAll('.log-item');
            const isDesktop = window.innerWidth >= 1024;

            items.forEach((item, i) => {
                item.classList.remove('active', 'visible');
                
                if (isDesktop) {
                    const diff = i - activeIndex;
                    const absDiff = Math.abs(diff);
                    
                    if (absDiff === 0) {
                        item.classList.add('active');
                        item.style.transform = `translate(40px, 0) scale(1.1)`;
                    } else if (absDiff <= 2) {
                        item.classList.add('visible');
                        const yOffset = diff * 85; 
                        const xOffset = absDiff * -15; 
                        const scale = 1 - (absDiff * 0.15);
                        const rotation = diff * 10; 
                        
                        item.style.transform = `translate(${xOffset}px, ${yOffset}px) rotate(${rotation}deg) scale(${scale})`;
                    } else {
                        const yOffset = diff > 0 ? 300 : -300;
                        item.style.transform = `translate(-50px, ${yOffset}px) scale(0.5)`;
                    }
                } else {
                    item.style.transform = 'none';
                    if (i === activeIndex) {
                        item.classList.add('active');
                        // Center the active log entry horizontally on mobile devices
                        item.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }
                }
            });
        }

        window.addEventListener('resize', updateNavPositions);

        // --- 3. HTMX INTEGRATION & EVENTS ---
        const navContainer = document.getElementById('log-nav');
        const contentArea = document.getElementById('log-content-area');

        // Handle clicks on wheel items
        navContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.log-item');
            if (!btn) return;
            
            const allItems = Array.from(document.querySelectorAll('.log-item'));
            activeIndex = allItems.indexOf(btn);
            updateNavPositions();
            
            document.getElementById('log-scroll-container').scrollTop = 0;
            contentArea.style.opacity = 0.5;
        });

        // After HTMX swaps new content
        document.body.addEventListener('htmx:afterSettle', function(evt) {
            const targetId = evt.detail.target.id;
            
            if (targetId === 'log-content-area') {
                contentArea.style.transition = 'opacity 0.4s ease';
                contentArea.style.opacity = 1;
                
                // Convert python-markdown code blocks into div.mermaid for mermaid.js
                evt.detail.target.querySelectorAll('code.language-mermaid').forEach(el => {
                    const pre = el.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = el.textContent;
                    pre.replaceWith(div);
                });

                // Run mermaid on newly injected HTML
                mermaid.init(undefined, evt.detail.target.querySelectorAll('.mermaid'));
            }
            
            if (targetId === 'log-nav' || evt.detail.target.closest('#log-nav')) {
                updateNavPositions();
            }
        });

        // Initial setup
        updateNavPositions();
        
        // Auto-load first item on boot
        window.addEventListener('DOMContentLoaded', () => {
            const firstItem = document.querySelector('.log-item');
            if (firstItem) {
                htmx.trigger(firstItem, 'click');
            }
        });
    </script>
        </div>
    </div>
</body>
</html>
