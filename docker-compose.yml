services:
  db:
    image: postgres:15-alpine
    #ports:
    #  - "5432:5432"
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
  web:
    build: .
    image: djangoportfolio:latest
    restart: unless-stopped
    command: sh -c "python manage.py collectstatic --noinput && gunicorn djangoPortfolio.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile - --log-level info --capture-output"
    #ports:
    #  - 7777:8000
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - huey_volume:/app/huey_data
    environment:
      POSTGRES_HOST: db
      HUEY_FILENAME: /app/huey_data/huey.sqlite3
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - red_n8n
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health"]

      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  huey:
    build: .
    image: djangoportfolio:latest
    restart: unless-stopped
    command: python manage.py run_huey
    volumes:
      - media_volume:/app/media
      - huey_volume:/app/huey_data
    environment:
      POSTGRES_HOST: db
      HUEY_FILENAME: /app/huey_data/huey.sqlite3
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - default
      - red_n8n

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "81:80"
    depends_on:
      web:
        condition: service_started
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./serve:/app/serve

networks:
  red_n8n:
    external: True
    name: n8n_default

volumes:
  pgdata:
  static_volume:
  media_volume:
  huey_volume:
