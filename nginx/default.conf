server {
	listen 80;

	proxy_http_version 1.1;

	gzip on;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
	gzip_min_length 1000;
	gzip_proxied any;
	gzip_vary on;

	server_tokens off;

	client_max_body_size 20M;

	add_header X-Content-Type-Options nosniff;
	add_header X-Frame-Options DENY;
	add_header Referrer-Policy strict-origin-when-cross-origin;
	add_header X-XSS-Protection "1; mode=block";

	proxy_connect_timeout 60s;
	proxy_send_timeout 60s;
	proxy_read_timeout 60s;
	send_timeout 60s;

	access_log /dev/stdout;
	error_log /dev/stderr warn;

	# Custom error page, served by nginx itself so it works even when Django is down.
	# SSI fills in the status code; `internal` keeps it from being requested directly.
	# Declared once here: an error_page inside a location would replace this list, not extend it.
	error_page 404 500 502 503 504 /_errors/error.html;
	location ^~ /_errors/ {
		internal;
		alias /app/serve/errors/;
		ssi on;
		add_header Cache-Control "no-store" always;
	}

    location = /security.txt {
        alias /app/serve/security.txt;
        default_type text/plain;
    }

    location = /.well-known/security.txt {
        alias /app/serve/security.txt;
        default_type text/plain;
    }

    location = /cv-en {
        mirror /_mirror/cv-en;
        mirror_request_body off;
        alias /app/serve/cv-en.pdf;
        default_type application/pdf;

        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /cv-es {
        mirror /_mirror/cv-es;
        mirror_request_body off;
        alias /app/serve/cv-es.pdf;
        default_type application/pdf;

        expires 30d;
        add_header Cache-Control "public, immutable";
    }

	# Fire-and-forget copy of PDF requests to Django, which reports them to Umami.
	# `internal` keeps it unreachable from outside; mirror failures never affect the client.
	location ~ ^/_mirror/(cv-(?:en|es))$ {
		internal;
		proxy_pass http://web:8000/_track/$1;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	# Django's /_track/ endpoint is only for the mirror above, never for the public.
	location ^~ /_track/ { return 404; }

	location /static/ {
		alias /app/staticfiles/;
		expires 30d;
		add_header Cache-Control "public, immutable";
	}

	location /media/ {
		alias /app/media/;
		expires 30d;
		add_header Cache-Control "public, immutable";
	}


	location / {
		proxy_pass http://web:8000;
		# Replace Django's 404 and 5xx responses with the page above.
		proxy_intercept_errors on;

		proxy_http_version 1.1;
		proxy_buffering on;

		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Real-IP $remote_addr;
	}
}
